<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Diamond Ace Form Definition</title>
  </head>
  <body>
    <!--
      Netlify scans this static file at deploy time to register the estimate form.
      Visitors never use this page directly; the React form posts matching fields
      here with application/x-www-form-urlencoded when deployed on Netlify.
    -->
    <form
      name="diamond-ace-estimate-request"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="company"
      hidden
    >
      <input type="hidden" name="form-name" value="diamond-ace-estimate-request" />
      <input
        type="hidden"
        name="subject"
        data-remove-prefix
        value="New Diamond Ace Estimate Request (%{submissionId})"
      />
      <input type="text" name="company" />
      <input type="text" name="projectType" />
      <input type="text" name="propertyCity" />
      <input type="text" name="propertyType" />
      <input type="text" name="services" />
      <input type="text" name="projectSize" />
      <input type="text" name="timeline" />
      <textarea name="notes"></textarea>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="preferredContactMethod" />
    </form>
  </body>
</html>
